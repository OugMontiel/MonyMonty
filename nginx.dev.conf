server {
  # Puerto interno sin privilegios para ejecución como usuario no-root
  listen 8082;
  server_name _;

  # Ocultar versión del servidor
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  # Límites de buffers para mitigación de ataques DoS
  client_body_buffer_size 16k;
  client_header_buffer_size 1k;
  client_max_body_size 5M;
  large_client_header_buffers 2 1k;

  # Restricción de métodos HTTP (incluyendo métodos REST para consumo de API)
  if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$) {
    return 405;
  }

  # Bloqueo estricto de acceso a archivos ocultos y de configuración
  location ~ /\. {
    deny all;
    access_log off;
    log_not_found off;
  }

  # ==============================================================================
  # CONTROL DE ACCESO PARA ENTORNO DE DESARROLLO:
  # Mecanismo de autenticación básica obligatoria para impedir acceso público no autorizado
  # ==============================================================================
  auth_basic "Entorno de Desarrollo MonyMonty - Acceso Restringido";
  auth_basic_user_file /etc/nginx/.htpasswd;

  # Opcional: Lista blanca de direcciones IP autorizadas (descomentar y parametrizar según necesidad)
  # allow 192.168.1.0/24;  # Red local corporativa / VPN
  # allow 181.12.34.56;    # IP estática de desarrolladores autorizados
  # deny all;              # Denegar el resto del tráfico público

  # 🔄 SPA Fallback
  location / {
    try_files $uri $uri/ /index.html;
  }

  # 📦 Cache de archivos estáticos
  location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|svg|woff2?|eot|ttf|json)$ {
    expires 1d;
    add_header Cache-Control "private, no-cache, no-store, must-revalidate";
    access_log off;
  }

  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
    add_header Pragma "no-cache";
    add_header Expires "0";
  }

  # 🔒 Cabeceras de seguridad para entorno de desarrollo (connect-src permite http/https/ws para pruebas de API)
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header X-Permitted-Cross-Domain-Policies "none" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' https: data:; connect-src 'self' http: https: ws: wss:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

  # 🛡️ Protección contra indexación en motores de búsqueda (Google, Bing, etc.)
  add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;

  access_log /var/log/nginx/access_dev.log;
  error_log /var/log/nginx/error_dev.log warn;

  error_page 404 /index.html;
}
