server {
  # Puerto interno sin privilegios (diferenciado para convivir en la misma VPN/red proxy)
  listen 8082;

  server_name _;

  # Ocultar versión y cabeceras de identificación de Nginx
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  # Límites de buffers para mitigación de ataques DoS y desbordamiento de búfer
  client_body_buffer_size 16k;
  client_header_buffer_size 1k;
  client_max_body_size 5M;
  large_client_header_buffers 2 1k;

  # Restricción de métodos HTTP: Permitir métodos necesarios para operación de la aplicación y API REST
  if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$) {
    return 405;
  }

  # Bloqueo estricto de acceso a archivos ocultos (ej. .git, .env, metadatos, etc.)
  location ~ /\. {
    deny all;
    access_log off;
    log_not_found off;
  }

  # 🔄 SPA Fallback (Vue Router en modo history)
  location / {
    try_files $uri $uri/ /index.html;
  }

  # 📦 Cache de archivos estáticos (1 semana)
  location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|svg|woff2?|eot|ttf|json)$ {
    expires 7d;
    add_header Cache-Control "public, must-revalidate";
    access_log off;
  }

  # Evitar cache del index.html (debe recargarse siempre para control de versiones)
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
    add_header Pragma "no-cache";
    add_header Expires "0";
  }

  # Compresión gzip segura
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/json
    application/javascript
    application/xml+rss
    application/x-javascript
    image/svg+xml;

  # 🔒 Cabeceras de seguridad reforzadas (connect-src habilitado para consumo de API externa por HTTPS)
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header X-Permitted-Cross-Domain-Policies "none" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' https: data:; connect-src 'self' https:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

  # Configuración de logs en directorios con permisos de usuario no-root
  access_log /var/log/nginx/access.log;
  error_log /var/log/nginx/error.log warn;

  # Página de error personalizada
  error_page 404 /index.html;
}
