server {
  listen 8080;

  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  # Cabeceras de seguridad globales
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' https: data:; connect-src 'self' https:; object-src 'none'; frame-ancestors 'none'; base-uri 'self';" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # 🔄 SPA Fallback (Vue Router en modo history)
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Cache de archivos estáticos (1 semana) con mantenimiento de cabeceras de seguridad
  location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|woff2?|eot|ttf|json)$ {
    expires 7d;
    access_log off;
    add_header Cache-Control "public, must-revalidate";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' https: data:; connect-src 'self' https:; object-src 'none'; frame-ancestors 'none'; base-uri 'self';" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  }

  # Evitar cache del index.html (debe recargarse siempre manteniendo cabeceras)
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
    add_header Pragma "no-cache";
    add_header Expires "0";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' https: data:; connect-src 'self' https:; object-src 'none'; frame-ancestors 'none'; base-uri 'self';" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  }

  # Compresión gzip
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types
      text/plain
      text/css
      text/xml
      text/javascript
      application/json
      application/javascript
      application/xml+rss
      application/x-javascript
      image/svg+xml;

  # Configuración de logs
  access_log /var/log/nginx/access.log;
  error_log /var/log/nginx/error.log;

  # Página de error personalizada (opcional)
  error_page 404 /index.html;
}